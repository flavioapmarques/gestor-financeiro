<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Fundo sofisticado com profundidade e gradiente escuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18122B"/>
      <stop offset="50%" stop-color="#0E0A1A"/>
      <stop offset="100%" stop-color="#07050E"/>
    </linearGradient>

    <!-- Gradiente vibrante do logotipo FMIT (Violeta para Azul Royal) -->
    <linearGradient id="fmitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Gradiente de Prosperidade / Alta Financeira (Esmeralda para Ciano) -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E096"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Gradiente de Borda Sutil Luminosa -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Brilho no topo do ícone -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtro de brilho neon suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Moderno -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect width="64" height="28" rx="16" fill="url(#topGlow)"/>

  <!-- Emblema Geométrico: Letra 'F' estilizada com Gráfico Ascendente & Carteira Digital -->
  
  <!-- Haste vertical do 'F' -->
  <rect x="15" y="14" width="8" height="36" rx="4" fill="url(#fmitGrad)"/>

  <!-- Braço intermediário do 'F' -->
  <rect x="22" y="29" width="16" height="7" rx="3.5" fill="url(#fmitGrad)"/>

  <!-- Braço superior com seta de alta e crescimento financeiro (Verde Neon) -->
  <path d="M 19 18 C 19 15.79 20.79 14 23 14 L 43 14 C 45.2 14 46.5 16.4 45.2 18.1 L 41.5 22.8 C 40.7 23.8 39.5 24.5 38.2 24.5 L 23 24.5 C 20.79 24.5 19 22.71 19 20.5 Z" fill="url(#growthGrad)" filter="url(#softGlow)"/>

  <!-- Ponto de pico / Moeda de prosperidade (Dourado/Neon) -->
  <circle cx="47" cy="18" r="4" fill="#FACC15" filter="url(#softGlow)"/>
  <circle cx="47" cy="18" r="2" fill="#FEF08A"/>

  <!-- Linha de pulso financeiro sutil na base -->
  <path d="M 28 46 L 33 41 L 38 45 L 47 36" stroke="#00E096" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#softGlow)"/>
</svg>
